name: financeflow

x-api-image: &api-image
  image: financeflow-api:local
  build: .

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU22-GDR1-ubuntu-22.04
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Generate local secrets first}
    ports:
      - '127.0.0.1:14333:1433'
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ['CMD-SHELL', 'SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1" -o /dev/null']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 20

  provision:
    <<: *api-image
    profiles: [tools]
    command: ['--provision-database']
    environment:
      Provisioning__AdminConnectionString: 'Server=sqlserver;Database=master;User ID=sa;Password=${MSSQL_SA_PASSWORD:?Generate local secrets first};Encrypt=True;TrustServerCertificate=True'
      Migration__ConnectionString: 'Server=sqlserver;Database=FinanceFlow;User ID=FinanceFlowMigrator;Password=${MIGRATION_DB_PASSWORD:?Generate local secrets first};Encrypt=True;TrustServerCertificate=True'
      Database__ConnectionString: 'Server=sqlserver;Database=FinanceFlow;User ID=FinanceFlowApi;Password=${API_DB_PASSWORD:?Generate local secrets first};Encrypt=True;TrustServerCertificate=True'
    depends_on:
      sqlserver:
        condition: service_healthy

  migrations:
    <<: *api-image
    profiles: [tools]
    command: ['--migrate']
    environment:
      Migration__ConnectionString: 'Server=sqlserver;Database=FinanceFlow;User ID=FinanceFlowMigrator;Password=${MIGRATION_DB_PASSWORD:?Generate local secrets first};Encrypt=True;TrustServerCertificate=True'
    depends_on:
      sqlserver:
        condition: service_healthy

  api:
    <<: *api-image
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/api.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${HTTPS_CERTIFICATE_PASSWORD:?Generate local secrets first}
      Database__ConnectionString: 'Server=sqlserver;Database=FinanceFlow;User ID=FinanceFlowApi;Password=${API_DB_PASSWORD:?Generate local secrets first};Encrypt=True;TrustServerCertificate=True'
      Jwt__Issuer: FinanceFlow.Local
      Jwt__Audience: FinanceFlow.Local.Client
      Jwt__SigningKeyBase64: ${JWT_SIGNING_KEY_BASE64:?Generate local secrets first}
    ports:
      - '127.0.0.1:5443:8443'
    volumes:
      - ./.local/certs:/https:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'dotnet', 'FinanceFlow.Api.dll', '--probe-readiness', 'https://localhost:8443/health/ready', '/https/api.crt']
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  sql-data:
