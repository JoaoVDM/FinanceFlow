name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  identity-and-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.4xx'
      - name: Verify Docker for mandatory SQL Server integration tests
        run: docker info
      - run: dotnet restore FinanceFlow.slnx --configfile NuGet.Config
      - run: dotnet build FinanceFlow.slnx --configuration Release --no-restore
      - run: dotnet test FinanceFlow.slnx --configuration Release --no-build --no-restore
        env:
          # Fixtures generate cryptographic credentials and keys in memory for each run.
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
